openapi: 3.0.3
info:
  title: API de Gestión de Cursos Universitarios
  description: Especificación OpenAPI para administrar cursos universitarios.
  version: 1.0.0
paths:
  /api/cursos:
    get:
      summary: Consultar todos los cursos
      responses:
        '200':
          description: Lista de cursos recuperada exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Curso'
    post:
      summary: Crear un nuevo curso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CursoCreacion'
      responses:
        '201':
          description: Curso creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Curso'

  /api/cursos/buscar:
    get:
      summary: Consultar curso por código
      parameters:
        - name: codigo
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Curso encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Curso'
        '404':
          description: Curso no encontrado

  /api/cursos/{id}:
    put:
      summary: Actualizar un curso
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CursoCreacion'
      responses:
        '200':
          description: Curso actualizado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Curso'
        '404':
          description: Curso no encontrado
    delete:
      summary: Eliminar un curso
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Curso eliminado exitosamente
        '404':
          description: Curso no encontrado

components:
  schemas:
    Curso:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        nombre:
          type: string
          example: "Programación II"
        codigo:
          type: string
          example: "PRG-202"
        creditos:
          type: integer
          example: 4
        estado:
          type: string
          example: "ACTIVO"
    CursoCreacion:
      type: object
      properties:
        nombre:
          type: string
          example: "Programación II"
        codigo:
          type: string
          example: "PRG-202"
        creditos:
          type: integer
          example: 4
        estado:
          type: string
          example: "ACTIVO"