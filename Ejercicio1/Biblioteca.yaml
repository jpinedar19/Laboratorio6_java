openapi: 3.0.3
info:
  title: API de Gestión de Biblioteca
  description: Especificación OpenAPI para administrar libros en una biblioteca.
  version: 1.0.0
paths:
  /api/libros:
    get:
      summary: Consultar todos los libros
      responses:
        '200':
          description: Lista de libros recuperada exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Libro'
    post:
      summary: Registrar un nuevo libro
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibroCreacion'
      responses:
        '201':
          description: Libro creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Libro'

  /api/libros/buscar:
    get:
      summary: Consultar libro por título
      parameters:
        - name: titulo
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Libro encontrado
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Libro'
        '404':
          description: No se encontraron libros con el título proporcionado

  /api/libros/{id}:
    put:
      summary: Actualizar un libro existente
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibroCreacion'
      responses:
        '200':
          description: Libro actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Libro'
        '404':
          description: Libro no encontrado
    delete:
      summary: Eliminar un libro por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Libro eliminado exitosamente
        '404':
          description: Libro no encontrado

components:
  schemas:
    Libro:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        titulo:
          type: string
          example: "Cien años de soledad"
        autor:
          type: string
          example: "Gabriel García Márquez"
        isbn:
          type: string
          example: "978-0307474728"
        anioPublicacion:
          type: integer
          example: 1967
        estado:
          type: string
          example: "DISPONIBLE"
    LibroCreacion:
      type: object
      properties:
        titulo:
          type: string
          example: "Cien años de soledad"
        autor:
          type: string
          example: "Gabriel García Márquez"
        isbn:
          type: string
          example: "978-0307474728"
        anioPublicacion:
          type: integer
          example: 1967
        estado:
          type: string
          example: "DISPONIBLE"