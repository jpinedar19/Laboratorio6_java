openapi: 3.0.3
info:
  title: API de Gestión de Reservas de Hotel
  description: Especificación OpenAPI para administrar reservas de hotel.
  version: 1.0.0
paths:
  /api/reservas:
    get:
      summary: Consultar todas las reservas
      responses:
        '200':
          description: Lista de reservas recuperada exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reserva'
    post:
      summary: Crear una nueva reserva
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservaCreacion'
      responses:
        '201':
          description: Reserva creada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'

  /api/reservas/{id}:
    get:
      summary: Consultar reserva por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Reserva encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'
        '404':
          description: Reserva no encontrada
    put:
      summary: Actualizar una reserva
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservaCreacion'
      responses:
        '200':
          description: Reserva actualizada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reserva'
        '404':
          description: Reserva no encontrada
    delete:
      summary: Cancelar una reserva
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Reserva cancelada exitosamente
        '404':
          description: Reserva no encontrada

components:
  schemas:
    Reserva:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 101
        nombreCliente:
          type: string
          example: "Carlos López"
        habitacion:
          type: string
          example: "302-A"
        fechaEntrada:
          type: string
          format: date
          example: "2026-10-15"
        fechaSalida:
          type: string
          format: date
          example: "2026-10-20"
        estado:
          type: string
          example: "CONFIRMADA"
    ReservaCreacion:
      type: object
      properties:
        nombreCliente:
          type: string
          example: "Carlos López"
        habitacion:
          type: string
          example: "302-A"
        fechaEntrada:
          type: string
          format: date
          example: "2026-10-15"
        fechaSalida:
          type: string
          format: date
          example: "2026-10-20"
        estado:
          type: string
          example: "CONFIRMADA"